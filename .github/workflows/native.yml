name: Native Rust builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: cargo run --locked --release --example icon_atlas -- artifacts/icons.svg
      - name: Linux glibc 2.35 release baseline
        if: runner.os == 'Linux'
        run: python3 tools/build-portable-linux.py
      - run: python tools/package-native.py
      - uses: actions/upload-artifact@v4
        with:
          name: opendotnet-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
